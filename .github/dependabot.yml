version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # WiX 7 以降は EULA の承諾と Open Source Maintenance Fee の対象。WiX 6 に留める（global.json で固定）
      - dependency-name: "WixToolset.*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

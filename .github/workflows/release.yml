name: Release

# タグ vX.Y.Z の push で MSI をビルドし、GitHub Releases に添付する。
# GITHUB_TOKEN（contents: write）だけを使い、OIDC・署名鍵は使わない。
# このリポジトリは public のため、WINDOWS_RUNNER は設定せず、GitHub-hosted で動かす。
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ${{ vars.WINDOWS_RUNNER && vars.WINDOWS_RUNNER || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet publish src/WuTrayToggle -c Release -o publish
      - run: dotnet build installer/WuTrayToggle.Installer.wixproj -c Release -p:PublishDir=${{ github.workspace }}\publish
      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = Get-ChildItem installer/bin/x64/Release/*.msi | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $msi.FullName --title "${{ github.ref_name }}" --generate-notes

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ vars.LINUX_RUNNER && !github.event.pull_request.head.repo.fork && vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.gitignore'
              - '!.github/FUNDING.yml'
              - '!.github/CODEOWNERS'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/*_TEMPLATE.md'
              - '!.github/pull_request_template.md'
              - '!.github/copilot-instructions.md'
              - '!.github/workflows/dev-charter-check.yml'
              - '!.github/workflows/auto-assign-self.yml'
              # dev-charter distributed files (brought in by git subtree update PRs)
              - '!.pre-commit-config.yaml'
              - '!scripts/{check-ai-context-reference,check-charter-ci-template,check-charter-doc-links,check-charter-subtree-edit,check-conventional-commit,check-dotenv-gitignore,check-language-pair-footer,check-language-pair-sync,check-license-exists,check-local-charter-version,check-markdown-heading-language,check-not-on-default-branch,check-powershell-lint,check-python-package-management,check-readme-placeholders,check-version-date,new-branch}.{sh,ps1}'
              - '!scripts/PSScriptAnalyzerSettings.psd1'

  security:
    name: Security scan (pre-commit)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ vars.LINUX_RUNNER && !github.event.pull_request.head.repo.fork && vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pre-commit/action@v3.0.1
        env:
          # powershell-lint is a local-only helper (see .pre-commit-config.yaml)
          SKIP: powershell-lint

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.WINDOWS_RUNNER && !github.event.pull_request.head.repo.fork && vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet format WuTrayToggle.slnx --verify-no-changes
      # CI=true のため、警告はエラーになる（Directory.Build.props）
      - run: dotnet build WuTrayToggle.slnx -c Release --no-incremental

  build:
    name: Build
    needs: [changes, security, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.WINDOWS_RUNNER && !github.event.pull_request.head.repo.fork && vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test --solution WuTrayToggle.slnx -c Release
      - run: dotnet publish src/WuTrayToggle -c Release -o publish
      - run: dotnet build installer/WuTrayToggle.Installer.wixproj -c Release -p:PublishDir=${{ github.workspace }}\publish

  gate:
    name: CI
    needs: [changes, security, lint, build]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ${{ vars.LINUX_RUNNER && !github.event.pull_request.head.repo.fork && vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "::error::security did not succeed (got: ${{ needs.security.result }})"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "docs/config-only change; nothing further to verify"
            exit 0
          fi
          for result in "${{ needs.lint.result }}" "${{ needs.build.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job did not succeed (got: $result)"
              exit 1
            fi
          done
